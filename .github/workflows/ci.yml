name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
          components: rustfmt, clippy

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: no-default feature build
        run: cargo test --no-default-features --lib

      - name: doc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

      - name: no-default docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --no-default-features

      - name: examples
        run: cargo build --examples --all-features

      - name: test
        run: cargo test --all-features

      - name: Semver check
        if: github.event_name == 'pull_request'
        run: |
          cargo install cargo-semver-checks --locked || true
          cargo semver-checks

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.80.0"

      - name: check library with all features
        run: cargo check --lib --all-features

      - name: check raw library without default features
        run: cargo check --lib --no-default-features
